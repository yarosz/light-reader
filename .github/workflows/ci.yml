name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1" # weekly: SDK main drift check
  workflow_dispatch:

jobs:
  build:
    # Required check. Clean Linux machine, committed files only: unit tests, then the Reader built the
    # way Light's release builder builds it, against the pinned SDK tag.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the removed legacy "tools" package.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and property tests
        run: ./gradlew --console=plain :tool:testDebugUnitTest
      - name: Light-builder simulation (pinned SDK)
        run: scripts/light-build.sh

  sdk-main:
    # Early warning, never blocking: does the Reader still build against Light's newest SDK?
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Light-builder simulation (SDK main)
        run: |
          git clone --depth 1 https://github.com/lightphone/light-sdk.git "$RUNNER_TEMP/sdk-main"
          scripts/light-build.sh "$RUNNER_TEMP/sdk-main"
