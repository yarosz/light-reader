[tools]
java = "temurin-17"
android-sdk = "23.0"

[env]
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/Library/Android/sdk"
_.path = [
  "{{env.HOME}}/Library/Android/sdk/emulator",
  "{{env.HOME}}/Library/Android/sdk/platform-tools",
]

[tasks.emu]
description = "Boot the LightPhone3 AVD (writable system, required every boot; public DNS, since the host's resolver can fail silently in the emulator)"
run = "emulator -avd LightPhone3 -writable-system -no-snapshot -no-boot-anim -dns-server 1.1.1.1,8.8.8.8"

[tasks.tool]
description = "Build (for the emulator's LightOS app), install, and launch on the running emulator"
run = [
  "scripts/emulator-build.sh ./gradlew :tool:assembleDebug",
  "adb -e install -r tool/build/outputs/apk/debug/tool-debug.apk",
  "adb -e shell monkey -p com.yarosz.reader 1",
]

[tasks.tool-lp3]
description = "Build (for LightOS), install, and launch on the USB-attached Light Phone III"
run = [
  "./gradlew :tool:assembleDebug",
  "adb -d install -r tool/build/outputs/apk/debug/tool-debug.apk",
  "adb -d shell monkey -p com.yarosz.reader 1",
]

[tasks.lightos]
description = "Rebuild + reinstall the LightOS emulator system app (keeps uid 1000)"
run = [
  "./gradlew :sdk:emulator:assembleDebug",
  "adb install -r light-sdk/sdk/emulator/build/outputs/apk/debug/emulator-debug.apk",
]

[tasks.ci]
description = "Local CI: tests, Light-builder simulation, emulator (+ LP3 if attached) round trip; posts signoff statuses"
run = "scripts/ci.sh"

[tasks.perf]
description = "Measure opens, font changes, page turns and memory on a device against ADRs 0007 and 0009 (args: [-s serial] [-n runs] [-r [-u]] [-i item] [-w | -o offset] [-c chars] <epub path or URL>)"
run = "scripts/perf.sh"

[tasks.domain-drift]
description = "List possible new domain terms since the last domain-pass/* tag (advisory; AGENTS.md)"
run = "scripts/domain-drift.sh"

[tasks.light-build]
description = "Build the committed HEAD the way Light's release builder does (optional arg: SDK dir)"
run = "scripts/light-build.sh"

[settings]
# Only install what this repo pins; do not auto-install tools from parent directories
task.run_auto_install = false
exec_auto_install = false
